spring.application.name=myshop-backend
server.port=8080

# Profiles: 'mysql' (standard production) or 'dev' (zero-config in-memory MySQL-compatible mode)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT Security Configuration
myshop.jwt.secret=${JWT_SECRET}
myshop.jwt.expiration-ms=86400000

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson JSON config
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Spring Data Pageable Serialization
spring.data.web.pageable.serialization-mode=direct
